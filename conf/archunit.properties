# ArchUnit configuration (JCLAW-1150). Read from the classpath; conf/ is on it.

# The frozen baseline in archunit_store/ is committed, so a run must never mint
# a fresh one — that would silently re-freeze whatever violations it happens to
# find and turn the rule into a no-op. Flip to true for exactly one run to
# regenerate the store after deliberately widening a rule, then flip it back.
freeze.store.default.allowStoreCreation=false
