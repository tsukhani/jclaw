# Testing. Set up a custom configuration for test mode
# ~~~~~
#%test.module.cobertura=${play.path}/modules/cobertura
%test.module.testrunner=${play.path}/modules/testrunner
%test.http.port=9100
%test.application.mode=dev
%test.db.url=jdbc:h2:mem:play;MODE=MYSQL;LOCK_MODE=0
%test.jpa.ddl=create
%test.mail.smtp=mock
%test.jclaw.skills.path=tmp/test-skills

# JaCoCo Java agent loads into the test JVM under %test only. `play auto-test`
# honors `javaagent.path` as a framework convention, attaches the agent at
# startup, and the agent writes `jacoco.exec` at JVM shutdown. A follow-up
# `java -jar bin/jacococli.jar report jacoco.exec --xml jacoco.xml ...` run in
# the Jenkinsfile converts the binary into Sonar-readable XML at the path
# referenced by `sonar.coverage.jacoco.xmlReportPaths` in conf/sonar.properties.
# Agent exclusions live in conf/jacoco-agent.properties.
%test.javaagent.path=bin/jacocoagent.jar

# =============================================================================
# JClaw Configuration
# =============================================================================

# Admin username (display only — the password is stored as a PBKDF2 hash in
# the Config table under `auth.admin.passwordHash` and is set via the in-app
# setup screen on first boot. There is no conf-based password fallback; if
# the Config row is absent, the frontend routes to /setup-password.)
# ~~~~~
jclaw.admin.username=admin

# JCLAW-741: login hardening. Failed-login throttle (per source IP) and
# breached-password screening. Breach screening queries Have I Been Pwned's
# k-anonymity range API (only a SHA-1 prefix leaves the process) and falls back
# to conf/common-passwords.txt when the call is disabled/unreachable/times out.
# All keys have safe code defaults — the commented lines are for discoverability.
# %test disables the online call so the suite stays offline and deterministic.
# ~~~~~
#auth.login.rate-limit.max-failures=10
#auth.login.rate-limit.window-seconds=300
#auth.password.breach-check.enabled=true
#auth.password.breach-check.timeout-ms=3000
%test.auth.password.breach-check.enabled=false
# Effectively disable the failed-login throttle under %test: the ~50 functional
# controller tests all authenticate from the same loopback IP, and the limiter
# is process-global, so a low threshold could spuriously 429 a concurrent test.
# The throttle logic itself is covered directly by LoginRateLimiterTest.
%test.auth.login.rate-limit.max-failures=100000

# Workspace root path
# ~~~~~
jclaw.workspace.path=workspace
%test.jclaw.workspace.path=workspace-test

# Lucene index directory. Tests resolve a dedicated index (JCLAW-428) so the
# suite never reads or writes the production data/jclaw-lucene/ index — read
# by LuceneIndexer.indexPath via Play.configuration, which honours the %test.
# prefix. Production leaves the key unset and falls back to data/jclaw-lucene.
%test.jclaw.search.lucenePath=data/jclaw-lucene-test

# Memory backend — single Postgres/H2-backed store. Vector memory (provider,
# model, dimensions, on/off) is configured in the app, not here: those settings
# moved to the config store in JCLAW-930 so they can be changed without a restart.
# On PostgreSQL the pgvector schema is provisioned at startup from them (JCLAW-528);
# on H2 the vector leg is the Lucene HNSW backend and no pgvector SQL is attempted.

# JCLAW-261: explicit IANA timezone override for CRON / SCHEDULED tasks
# that don't specify their own. Set this ONLY to run tasks in a zone
# different from your own — e.g. tasks in UTC while the assistant speaks
# your local time. When unset (the default), CRON / SCHEDULED tasks follow
# the operator's wall-clock zone (app.timezone below), so a 9 AM task fires
# at your 9 AM rather than 9 AM UTC. The Config DB key `tasks.defaultTimezone`
# (Settings → Tasks) overrides this line at runtime. Must be a valid IANA
# zone id. Shipped commented-out so the operator-zone default applies.
# tasks.defaultTimezone=UTC

# Operator wall-clock timezone — the single zone JClaw treats as "where the
# operator is". Used as the assistant's "now" in the system prompt AND as the
# default zone for CRON / SCHEDULED tasks (see tasks.defaultTimezone above).
# The Config DB key `app.timezone` (set via Settings → Timezone) overrides
# this; with both absent it falls back to the server's JVM zone
# (ZoneId.systemDefault()), so this line is intentionally left unset rather
# than pinned. Uncomment and set a valid IANA zone id only to override the
# JVM default at the installation level.
# app.timezone=Asia/Kuala_Lumpur

# Event log retention is logs.retentionDays in Settings > Logging (default 30
# days). Settings accepts 1 or more; a 0 that reaches the table another way
# disables cleanup rather than emptying the log.

# Lucene index commit cadence (seconds)
# ~~~~~
# JCLAW-406: LuceneIndexer no longer fsyncs on every upsert/remove — search
# visibility comes from the NRT SearcherManager's maybeRefresh, and durability
# is provided by a periodic background commit plus the commit on close().
# This is the interval between those background commits. The index is derived
# from DB rows (re-backfilled on boot), so the worst-case loss window on a hard
# crash is one interval of unsynced segments. Non-numeric / non-positive values
# fall back to the 30s default.
jclaw.search.commitIntervalSeconds=30

# JCLAW-803: the per-run task time limit is tasks.fireMaxDurationSeconds in
# Settings > Tasks (default 600 seconds; 0 disables it).

# Load testing harness
# ~~~~~
# Disabled by default. When enabled, POST /api/metrics/loadtest drives
# synthetic concurrent traffic against /api/chat/stream using an in-process
# mock LLM provider bound to loopback only. Do NOT enable in production —
# the harness bypasses the normal "use real provider" path by auto-creating
# a __loadtest__ agent wired to the mock server. Its port, maxConcurrency and
# maxTurns are Config DB keys under provider.loadtest-mock.* (defaults 19999,
# 100 and 50), not read from this file.

# Telegram channel (JCLAW-359/362/369/375 + parity work)
# ~~~~~
# Channel behaviour — reply mode, link previews, reactions, the ack reaction, message
# actions, the delivery-failure notifier, inbound coalescing, wake words and keyboard
# scope — is the telegram.* Config DB keys, set under Channel defaults on the
# Channels > Telegram page. The approval prompt timeout is
# telegram.approval.timeout-seconds in Settings > Tool Approvals.
#
# The webhook ingress hardening below stays in this file, where nothing that writes the
# config table can loosen it.
#
# M1 webhook ingress hardening. Per-binding pre-auth rate limit: at most `max`
# webhook requests per `window-seconds` fixed window, keyed by binding id and
# checked BEFORE the secret compare so wrong-secret floods are rejected cheaply
# (HTTP 429). Defaults max 60, window 60s.
# telegram.webhook.rate-limit.max=60
# telegram.webhook.rate-limit.window-seconds=60
#
# Reject webhook bodies larger than this many bytes with HTTP 413 before
# parsing (Content-Length first, actual read length as a backstop). Default
# 1048576 (1 MiB) — generous for Telegram updates, tight against abuse.
# telegram.webhook.max-body-bytes=1048576
#
# Whether JClaw sits behind a trusted reverse proxy. false (default): the
# socket peer is the client IP for logging. true: prefer the left-most
# X-Forwarded-For entry. Logging-only; does not gate requests.
# telegram.webhook.trusted-proxy=false
#
# JCLAW-783: the Slack and WhatsApp webhooks share a pre-auth ingress gate
# (WebhookIngressGate) that applies a per-source rate limit + max-body-bytes cap
# BEFORE any body parse or DB lookup, mirroring the telegram.webhook.* gate above.
# Each key defaults to the telegram.webhook.* value when unset, so these are
# opt-in overrides only. Slack keys the limiter on the binding id (in the URL
# path); WhatsApp keys it on the source IP (its id is only in the parsed body).
# slack.webhook.rate-limit.max=60
# slack.webhook.rate-limit.window-seconds=60
# slack.webhook.max-body-bytes=1048576
# slack.webhook.trusted-proxy=false
# whatsapp.webhook.rate-limit.max=60
# whatsapp.webhook.rate-limit.window-seconds=60
# whatsapp.webhook.max-body-bytes=1048576
# whatsapp.webhook.trusted-proxy=false

# JCLAW-805: web_fetch response-body cap. Bounds how many bytes of an
# untrusted (LLM-supplied) URL's response body WebFetchTool will ever hold on
# the heap — Content-Length pre-check first, bounded okio read as the backstop,
# the same design as telegram.webhook.max-body-bytes above. Default 10485760
# (10 MiB). Deliberately conf-based rather than Config-DB "tool config" (a
# named exception to the note below): it is a JVM-availability guard, not
# runtime tool behavior, so it stays deploy-time infrastructure config.
# web_fetch.max-body-bytes=10485760

# Database backup (JCLAW-1165). Backups are H2 online backups (BACKUP TO) — zips of the
# data file — written to data/backups/ by Settings > System > Database, `jclaw.sh backup`,
# or the daily schedule. Restore and repair run through `jclaw.sh` with the app stopped.
# None of these keys is seeded: the defaults below apply when a key is absent.
#   db.backup.dir                   — where backups go (default data/backups; relative to the
#                                     application root)
#   db.backup.retention             — backups to keep, oldest pruned after each new one (default 7)
#   db.backup.schedule              — HH:mm in the operator's timezone for a daily backup
#                                     (default none). A failure is logged and shown in the panel.

# Tool-related configuration (tool enablement, allowlists, scanners, timeouts,
# etc.) is NOT defined here. It lives in the Config DB, seeded on first boot by
# DefaultConfigJob.seedToolConfig() and editable at runtime via the Settings UI
# (/api/config). Keep application.conf free of tool settings so the deploy-time
# infrastructure config and the runtime tool config never get confused.
#
# JCLAW-659 external coding-harness (runtime="acp") keys — DB-backed like the
# rest of the tool config above (read via ConfigService, editable in Settings);
# documented here for reference only, not active Play config:
#   subagent.acp.harness  — which harness adapter drives the acp runtime:
#                           pi | claude | codex | generic. Default: generic.
#   subagent.acp.mode     — how the acp runtime talks to the harness:
#                           batch (one-shot task-in/output-out) | json (parse a
#                           streamed line protocol) | rpc (bidirectional
#                           session). Default: batch.
#   subagent.acp.modelProvider / subagent.acp.modelId
#                         — the provider/model the harness runs with instead of
#                           its own default (unset = the harness's own model). A
#                           spawn's modelProvider/modelId args win over these.
#                           Bound per harness (HarnessModelBinding): claude gets
#                           --model plus ANTHROPIC_MODEL/ANTHROPIC_BASE_URL/
#                           ANTHROPIC_AUTH_TOKEN, codex -m plus an inline
#                           model_providers.jclaw block; pi and gemini take the
#                           model only; opencode/custom harnesses take neither
#                           and the spawn is refused up front.
#   subagent.acp.sandbox  — JCLAW-709: OS sandbox around the harness process
#                           (macOS Seatbelt / Linux bwrap; fail-closed if the
#                           mechanism is unavailable): false (default) | true |
#                           untrusted. SINGLE-OPERATOR TRADEOFF — the trusted
#                           operator's own web-driven coding runs are convenient
#                           and UNSANDBOXED by default. A hardened/untrusted
#                           deployment can opt into `true` (confine every run) or
#                           `untrusted` (confine only runs whose ORIGIN channel is
#                           not the operator's web chat — i.e. inbound Telegram/
#                           Slack, the prompt-injection surface — while keeping the
#                           operator's own web runs fast). Network egress stays
#                           open in all cases (the harness needs its API).
#
# JCLAW-1153 native-tool sandbox — DB-backed tool config too, unseeded like the key
# above (an absent key already means "off", so seeding it would only add a row):
#   shell.sandbox         — the same tri-state, same false default, applied to native
#                           tools that spawn processes: `exec` (the /bin/sh -c launch),
#                           `diarize_audio`'s ffmpeg voice-sample extraction, and the
#                           ffmpeg transcode of an audio attachment on its way to a
#                           model (LlmAudio, reached by any channel turn). A confined
#                           shell run may write only inside the agent's resolved
#                           workspace root; the ffmpeg runs only their temp directory;
#                           reads follow the shared profile.
#                           Separate from subagent.acp.sandbox on purpose — confining a
#                           coding harness is not the same request as confining every
#                           shell command. Fails closed identically: with the flag on
#                           and no usable mechanism the run aborts, unlaunched.
#                           The `browser` tool is NOT covered — Playwright spawns its
#                           own driver (no argv to wrap) and Chromium's internal
#                           sandbox refuses to initialize inside a Seatbelt profile.
#
# JCLAW-34 OpenTelemetry export — DB-backed too, and unseeded for the same reason:
# an absent key is "off", and nothing leaves the process until an operator turns
# it on in Settings → System → Telemetry (or POSTs the keys to /api/config).
#   otel.enabled                    — true/false (default false). Flipping it swaps the
#                                     sampler and both OTLP exporters live; no restart.
#   otel.exporter.endpoint          — collector base URL (default http://localhost:4318).
#                                     For http/protobuf the /v1/traces and /v1/metrics
#                                     paths are appended.
#   otel.exporter.protocol          — http/protobuf (default) | grpc
#   otel.exporter.secretHeaders     — name=value,name=value sent on every export;
#                                     vendor auth lives here, so the API masks it.
#   otel.service.name               — service.name on the resource (default jclaw);
#                                     service.version and deployment.environment.name
#                                     come from application.version and the play id.
#   otel.traces.sampler.ratio       — 0..1 share of root spans recorded (default 1.0).
#   otel.metrics.interval.seconds   — export cadence (default 60); the one key read at
#                                     start rather than live.
# Exported: HTTP server spans, turn spans with the model-call, HTTP client and JDBC spans
# beneath, gen_ai.client.* and jclaw.turn.segment.duration histograms, jvm.* runtime metrics.
# The OpenTelemetry Java agent is optional and separate: attach it through
# javaagent.path (see the %test line above) or JAVA_TOOL_OPTIONS, configure it with
# the standard OTEL_* variables, and the app routes its own spans into the agent's
# exporter — in which case the keys above are read at JVM start, not live.
# With the agent attached the app yields HTTP server, OkHttp, JDBC and JVM telemetry to it
# and names the agent's request spans from the route.
#
# JCLAW-709 off-channel dangerous-tool policy — DB-backed tool config too:
#   tool.approval.offChannelPolicy — what happens to a DANGEROUS tool (e.g. exec)
#                           dispatched from a channel with no interactive approve/
#                           deny surface (web, or a binding-less Telegram/Slack):
#                           allow (default) | deny | ask. SINGLE-OPERATOR TRADEOFF
#                           — `allow` keeps the trusted operator's web chat
#                           frictionless (a successful prompt injection could reach
#                           exec as the Play process user). A hardened deployment
#                           can opt into `deny` (fail closed) or `ask` (route the
#                           confirmation to the agent's bound Telegram DM, fail
#                           closed if there is none). A standing grant still
#                           proceeds under any policy.

# HTTPS is off by default. Run `./jclaw.sh https` to generate a TLS
# cert+key at certs/host.{cert,key} (mkcert preferred, openssl fallback);
# `./jclaw.sh start` then sets -Dhttps.port=9443 on the JVM when those
# certs pass strict validation, which the placeholder below picks up.
# `./jclaw.sh no-https` deletes the cert+key, which leaves the next
# `start` running on plain HTTP/1.1 only.
#
# The placeholder syntax ${https.port:-1} resolves at conf-load time
# (Play.java:440-468): System.getProperty("https.port") wins, falling
# back to the literal -1 (Play's "don't listen" sentinel). So this line
# is constant in git — no mutation by jclaw.sh, no commented/uncommented
# toggle. Operators who want a fixed port can replace the placeholder
# with a literal value (e.g. `https.port=8443`) — that opts out of the
# -D-driven toggle and pins the listener regardless of cert state.
https.port=${https.port:-1}
# Test-mode safety belt: pinned to -1 so FirePhoque never tries to bind
# HTTPS even when -Dhttps.port=9443 is set in the dev/prod JVM.
%test.https.port=-1

# play1 1.12.28+ ships secure-by-default response headers (PF-5). The default
# X-Frame-Options=DENY breaks the testrunner module's FirePhoque/HtmlUnit
# harness: the selenium runner (TestRunner.html, modules/testrunner/public)
# loads each .test.html suite via iframe. Disabling X-Frame-Options in test
# mode lets autotest pass while production keeps the secure default.
%test.http.headers.xFrameOptions=disabled

# Content-Security-Policy: intentionally empty. JClaw doesn't impose a CSP
# because the right policy depends on the deployment posture (a private
# desktop behind Tailscale vs a network-exposed deployment) — the operator decides.
# Mirrors the play1 1.12.30+ skel default. To enable, set a real value here.
# Note: the bundled Nuxt SPA always emits an inline window.__NUXT__ block
# whose content rotates per build, so any CSP must include 'unsafe-inline'
# for script-src (and defensively for style-src) — a strict default-src 'self'
# alone will blank the dashboard at runtime.
# One response sets its own regardless: ApiAgentsController.serveWorkspaceFile sends
# Content-Security-Policy: sandbox, because those bytes are agent-written (JCLAW-1227).
http.headers.contentSecurityPolicy=

# JCLAW-817: the primary-provider pin is llm.primaryProvider in Settings > LLM Providers.
#
# JCLAW-1158: provider.<name>.useNativeApi (Config DB, never seeded — absent means off) sends an
# Ollama provider's chat requests to the daemon's native /api/chat instead of the OpenAI-compatible
# /v1/chat/completions. Same request semantics; the response adds the daemon's per-request timings,
# which show in the message usage popover and as llm_*_duration histograms on /api/metrics/latency.
# A local daemon reports all four; ollama.com reports total_duration only. A 404/405 from /api/chat
# sends that one request over the OpenAI-compatible wire instead. Toggle: Settings > LLM Providers.

# JCLAW-1222: the model router, picked as router/auto wherever a model is picked. Edited in
# Settings > Model Router; nothing is seeded, and the router is offered exactly when
# router.chat.models names a model.
#   router.<class>.models   JSON array of {"provider":"…","model":"…"} in preference order, for
#                           class chat (also the default and the downshift target), summarize,
#                           agentic, reasoning or coding. A class with no list uses chat's.
#                           Prepaid providers (subscription or self-hosted) are tried before
#                           per-token ones whatever the order, unless router.preferPrepaid is off.
#   router.preferPrepaid       true (the default, and what an unset key means): included credit is
#                              spent before money is, whatever order the lists are in. Set false to
#                              follow the lists exactly as written — an operator who deliberately
#                              ranks a per-token model first gets it. The budget guard below applies
#                              either way.
#   router.budget.downshiftAt  usage fraction of a prepaid provider at which non-chat classes
#                              stop using it and fall back to the chat list (default 0.75)
#   router.budget.exhaustedAt  usage fraction at which a prepaid provider is skipped entirely
#                              (default 0.95)
#   router.classifier.provider / .model   optional: a model that labels each prompt with its class,
#                              instead of the local keyword rules. It answers with one word, costs one
#                              extra call on the turn's critical path, and sees the first 4000
#                              characters of the prompt — so a remote classifier is one more place the
#                              prompt goes. Unreachable, slow or unparseable answers fall back to the
#                              rules rather than failing the turn. Absent means rules only.
#   router.classifier.timeoutSeconds   how long that call may take (default 8)
# Usage is read from ollama.com's /api/usage for providers on that host; any provider is also
# benched for a while after a call fails for exhausted credit.

# JCLAW-1167: per-provider circuit breaker on the synchronous chat path. It wraps a whole
# chat() call, retry loop included, so an exhausted call records one failure rather than
# four; a 4xx (a request this codebase got wrong) records neither. Once open, a chat fails
# in microseconds instead of burning four attempts, which is what leaves chatWithFailover
# enough of the turn to reach the secondary provider. The thresholds and budgets below are
# the llm.breaker.* keys in Settings > LLM Providers > Circuit breaker tuning; their
# defaults live in LlmResilience.
#
# Sized for a single-operator install rather than a fleet: one exhausted chat against a hung
# provider is a twelve-minute retry loop, and a day's traffic is a few dozen calls, so a rate
# over a large window would take hours of dead turns to move. The streak rule opens on the
# present instead — three exhausted chats in a row, whatever the window says.
#
# JCLAW-1169: the same breaker guards the streaming path, where a dead stream never errors —
# it trickles, stalls, and holds the socket open while OkHttp's 180s read timeout resets on
# every keepalive. Total duration cannot tell that from a long answer, so what is measured is
# the gap between chunks: a stream whose worst gap passed stall-seconds is recorded as a slow
# call (which counts toward opening the breaker but is not a failure), and one that goes quiet
# mid-flight is charged while it is still hanging rather than never. The gap is armed by the
# first chunk, so a slow first token is judged by first-chunk-seconds below instead.
#
# The charge and the abort are separate budgets. stall-seconds only decides what the breaker
# counts as slow; the stream itself is ended at stall-abort-seconds, which releases the turn
# and hangs up the socket (JCLAW-1183). Kept apart because a local model re-evaluating its
# context mid-answer pauses for tens of seconds legitimately: that gap is evidence about the
# provider, but ending the turn on it would retract nothing and lose the rest of the answer.
#
# JCLAW-1181: the budget before the first chunk, which the gap above cannot cover and OkHttp's
# read timeout does not either — SSE keepalive comments are reads, so a provider (or a proxy)
# that emits them while producing nothing resets the read timeout for ever and hangs the turn
# with no ceiling anywhere. Ten minutes because a cold local model loading weights legitimately
# takes minutes to its first token; past it the stream is recorded as a failure and the caller's
# turn is ended rather than left waiting.
#
# The web chat's SSE inactivity budget is derived from this key (first-chunk-seconds plus two
# minutes, never under ten minutes) rather than fixed, so the abandonment error reaches the
# browser before the stream is cut (JCLAW-1192). It counts silence, not turn length: every
# token, reasoning, status or tool-call frame re-arms it, so a long tool loop is never cut by
# it (JCLAW-1204). Raise the budget and it follows.

# Real-time voice v2 (JCLAW-795): turn detection, live transcripts and speech pacing
# are the voice.* keys in Settings > Voice Mode. Per-turn latency for the voice
# pipeline is recorded under channel "voice" (segments voice_stt, voice_tts_synth,
# voice_reply = endpoint→first-audio, voice_turn) and shows on the Chat
# Performance dashboard alongside the LLM segments.
